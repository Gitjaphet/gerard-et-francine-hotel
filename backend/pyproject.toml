[project]
name = "gerard-et-francine-api"
version = "0.1.0"
description = "API de l'hôtel Gérard et Francine"
requires-python = ">=3.14"

# --- Ruff : lint et formatage ------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQLAlchemy résout les relations au chargement de la classe : les références
# vers des modèles déclarés plus bas doivent rester entre guillemets.
"app/models/**" = ["UP037"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- mypy : vérification des types -------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["migrations/"]

# --- pytest : tests ----------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
